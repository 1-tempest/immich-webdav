name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: immich-webdav:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (imports + HTTP boot)
        run: |
          # 1. Every module imports under this image's Python + pinned deps.
          docker run --rm --entrypoint python immich-webdav:smoke -c \
            "import immich_webdav.server, immich_webdav.setup_app, immich_webdav.webdav.provider, immich_webdav.webdav.resources; print('imports ok')"
          # 2. The server actually boots and serves. No Immich in CI, so only
          #    the Immich-free paths are exercised: GET / (setup page) must
          #    return 200, and a WebDAV request must get a real HTTP response
          #    (i.e. cheroot + wsgidav middleware chain is alive) rather than a
          #    connection refused.
          docker run -d --name iw -p 1700:1700 immich-webdav:smoke
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:1700/ -o body.html && ok=1 && break
            sleep 1
          done
          dav=$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci -X PROPFIND -H 'Depth: 0' http://localhost:1700/)
          docker logs iw
          running=$(docker inspect -f '{{.State.Running}}' iw)
          docker rm -f iw
          test "${ok:-}" = 1     || { echo "::error::server never answered GET / on :1700"; exit 1; }
          test -s body.html      || { echo "::error::empty GET / body"; exit 1; }
          test "$running" = true || { echo "::error::container exited after boot"; exit 1; }
          echo "PROPFIND / -> HTTP $dav"
          case "$dav" in 000|"") echo "::error::wsgidav/cheroot did not respond to PROPFIND"; exit 1;; esac

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
